<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexander Mutsala Nzaywa — Data Engineer</title>
    <meta
      name="description"
      content="Alexander Mutsala Nzaywa — data engineer who builds software, from pipelines to production APIs. Kenya, open to remote."
    />
    <meta name="theme-color" content="#0C0C0C" />

    <!-- Canonical (per-route value is set by usePageMeta at runtime;
         %SITE_URL% is replaced at build time from src/data/site.ts) -->
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alexander Mutsala Nzaywa" />
    <meta property="og:title" content="Alexander Mutsala Nzaywa — Data Engineer" />
    <meta
      property="og:description"
      content="Data engineer who builds software, from pipelines to production APIs. Kenya, open to remote."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/media/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Alexander Mutsala Nzaywa — data engineer who builds software"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alexander Mutsala Nzaywa — Data Engineer" />
    <meta
      name="twitter:description"
      content="Data engineer who builds software, from pipelines to production APIs. Kenya, open to remote."
    />
    <meta name="twitter:image" content="%SITE_URL%/media/og.png" />

    <!-- Icons: SVG monogram + PNG apple touch icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style>
      html {
        background: #0c0c0c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
